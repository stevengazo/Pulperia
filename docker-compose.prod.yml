services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pulpepos-db
    ports:
      - "11433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - ./mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    image: ${IMAGE:-stevengazo/pulpepos:latest}
    container_name: pulpepos-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Pulperia;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Supabase__Url: ${SUPABASE_URL}
      Supabase__AnonKey: ${SUPABASE_ANONKEY}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
    restart: unless-stopped

volumes:
  mssql-data:
  app-logs:
